[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "lesson_*.py",
    "main.py",
    "test_main.py",
    "test_lesson_08.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "lesson_*.py",
    "main.py",
    "test_*.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90